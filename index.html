  *{box-sizing:border-box;}
  html,body{margin:0;padding:0;}
  body{
    min-height:100vh;
    background-color:var(--bg-0);
    background-image:
      linear-gradient(180deg, rgba(5,3,3,.55) 0%, rgba(5,3,3,.80) 38%, rgba(5,3,3,.96) 78%, #050303 100%),
      radial-gradient(ellipse at 50% 8%, rgba(216,18,18,.18), transparent 55%),
      var(--bg-image);
    background-repeat:no-repeat;
    background-size: cover, cover, cover;
    background-position: center top, center top, center 12%;
    background-attachment: fixed, fixed, fixed;
    font-family:'Inter',system-ui,sans-serif;
    color:var(--ink);
    -webkit-font-smoothing:antialiased;
  }

  ::selection{ background:var(--blood); color:#fff; }

  ::-webkit-scrollbar{ width:10px; height:10px; }
  ::-webkit-scrollbar-track{ background:transparent; }
  ::-webkit-scrollbar-thumb{ background:#3a1414; border-radius:8px; border:2px solid transparent; background-clip:content-box; }

  .display{
    font-family:'Bebas Neue', sans-serif;
    letter-spacing:.04em;
  }
  .mono{
    font-family:'JetBrains Mono', monospace;
  }

  a, button, input, select{ font-family:inherit; }
  button{ cursor:pointer; }

  /* ---------- Layout shell ---------- */
  .app{
    max-width:1180px;
    margin:0 auto;
    padding: 28px 20px 80px;
  }

  /* ---------- Header ---------- */
  .header{
    display:flex;
    align-items:center;
    justify-content:space-between;
    gap:16px;
    padding-bottom:22px;
    border-bottom:1px solid var(--border-soft);
    margin-bottom:26px;
    flex-wrap:wrap;
  }
  .brand{ display:flex; align-items:center; gap:14px; }
  .brand-mark{
    width:46px; height:46px; border-radius:11px;
    background:linear-gradient(155deg,#1a0e0e,#0a0505);
    border:1px solid var(--border-blood);
    display:flex; align-items:center; justify-content:center;
    box-shadow: inset 0 0 14px rgba(216,18,18,.25);
    flex-shrink:0;
  }
  .brand-title{ line-height:1; display:flex; flex-direction:column; gap:2px; }
  .brand-title .t1{
    font-size:30px;
    color:var(--blood-bright);
    text-shadow: 0 0 14px rgba(255,43,43,.65), 0 0 34px rgba(255,43,43,.35);
    display:flex; gap:10px; align-items:baseline;
  }
  .brand-title .t1 .sub{
    color:var(--ink);
    text-shadow:none;
    font-size:20px;
    letter-spacing:.18em;
    color: var(--ink-dim);
  }
  .brand-title .tag{
    font-size:11.5px; color:var(--ink-faint); letter-spacing:.14em; text-transform:uppercase;
  }

  .header-actions{ display:flex; align-items:center; gap:12px; }

  .conn-pill{
    display:flex; align-items:center; gap:7px;
    font-size:12px; color:var(--ink-dim);
    padding:7px 12px; border-radius:999px;
    border:1px solid var(--border-soft);
    background:rgba(255,255,255,.02);
  }
  .conn-dot{ width:7px; height:7px; border-radius:50%; background:var(--ink-faint); }
  .conn-dot.ok{ background:var(--green); box-shadow:0 0 8px rgba(51,217,119,.8); }
  .conn-dot.bad{ background:var(--red-status); box-shadow:0 0 8px rgba(255,75,75,.8); }

  .btn{
    display:inline-flex; align-items:center; gap:8px;
    border:none; border-radius:10px;
    font-weight:600; font-size:14px;
    padding:11px 18px;
    transition: transform .12s ease, box-shadow .12s ease, background .15s ease, border-color .15s ease;
  }
  .btn:active{ transform: scale(.97); }
  .btn-primary{
    background: linear-gradient(135deg, var(--blood-bright), var(--blood-dim));
    color:#fff;
    box-shadow: 0 8px 24px rgba(216,18,18,.35), inset 0 1px 0 rgba(255,255,255,.15);
  }
  .btn-primary:hover{ box-shadow: 0 10px 30px rgba(255,43,43,.55), inset 0 1px 0 rgba(255,255,255,.2); }
  .btn-ghost{
    background:rgba(255,255,255,.03);
    border:1px solid var(--border-soft);
    color:var(--ink-dim);
  }
  .btn-ghost:hover{ color:var(--ink); border-color:rgba(255,255,255,.2); }

  /* ---------- Hero cover ---------- */
  .hero-cover{
    position:relative;
    height:220px;
    border-radius:var(--radius);
    overflow:hidden;
    margin-bottom:22px;
    border:1px solid var(--border-blood);
    background-image:
      linear-gradient(180deg, rgba(5,3,3,.15) 0%, rgba(5,3,3,.55) 55%, rgba(5,3,3,.96) 100%),
      var(--bg-image);
    background-size:cover;
    background-position:center 14%;
    box-shadow: var(--shadow-deep), 0 0 50px rgba(216,18,18,.18) inset;
  }
  .hero-cover .hero-inner{
    position:absolute; left:0; right:0; bottom:0; padding:18px 24px;
    display:flex; align-items:flex-end; justify-content:space-between; gap:14px; flex-wrap:wrap;
  }
  .hero-cover .hero-txt .k1{
    font-size:12px; letter-spacing:.22em; text-transform:uppercase; color:var(--ink-dim);
    text-shadow:0 2px 8px rgba(0,0,0,.8);
  }
  .hero-cover .hero-txt .k2{
    font-family:'Bebas Neue'; font-size:32px; letter-spacing:.03em; color:var(--blood-bright);
    text-shadow: 0 0 18px rgba(255,43,43,.7), 0 2px 10px rgba(0,0,0,.9);
  }
  @media (max-width:760px){
    .hero-cover{ height:170px; }
    .hero-cover .hero-txt .k2{ font-size:24px; }
  }

  /* ---------- Stats strip ---------- */
  .stats{
    display:flex;
    gap:0;

  .toolbar{

  .chip{

  .chip.active{
    color:#fff; border-color:transparent;

  }

  /* ---------- Table (desktop) ---------- */
  .panel{
    border:1px solid var(--border-soft);
    border-radius:var(--radius);
    background:var(--bg-panel);
    backdrop-filter: blur(6px);
    overflow:hidden;
  }
  .table{ width:100%; border-collapse:collapse; }
  .table thead th{
    text-align:left; font-size:10.5px; letter-spacing:.13em; text-transform:uppercase;
    color:var(--ink-faint); font-weight:600;
    padding:14px 18px; border-bottom:1px solid var(--border-soft);
  }
  .table tbody tr{
    border-bottom:1px solid rgba(255,255,255,.05);

    transition: background .15s ease;
  }
  .table tbody tr:last-child{ border-bottom:none; }
  .table tbody tr:hover{ background:rgba(216,18,18,.05); }
  .table tbody tr:hover::after{
    content:"";
    position:absolute; inset:0; pointer-events:none;

  .table td{ padding:14px 18px; font-size:13.5px; vertical-align:middle; }

  .status-cell{ display:flex; align-items:center; gap:9px; white-space:nowrap; }
  .dot{ width:9px; height:9px; border-radius:50%; flex-shrink:0; }
  .dot.green{ background:var(--green); box-shadow:0 0 0 0 rgba(51,217,119,.6); animation:pulse-green 1.8s infinite; }
  .dot.yellow{ background:var(--yellow); box-shadow:0 0 0 0 rgba(255,201,61,.6); animation:pulse-yellow 1s infinite; }
  .dot.red{ background:var(--red-status); box-shadow:0 0 6px rgba(255,75,75,.7); }
  .dot.paused{ background:#8ba3c7; box-shadow:0 0 6px rgba(139,163,199,.6); }
  @keyframes pulse-green{
    0%{ box-shadow:0 0 0 0 rgba(51,217,119,.55); }
    70%{ box-shadow:0 0 0 7px rgba(51,217,119,0); }
    100%{ box-shadow:0 0 0 0 rgba(51,217,119,0); }
  }
  @keyframes pulse-yellow{
    0%{ box-shadow:0 0 0 0 rgba(255,201,61,.6); }

    100%{ box-shadow:0 0 0 0 rgba(255,201,61,0); }
  }
  .status-txt{ font-size:12px; color:var(--ink-dim); }
  .status-txt.green{ color:var(--green); }
  .status-txt.yellow{ color:var(--yellow); }
  .status-txt.red{ color:var(--red-status); }
  .status-txt.paused{ color:#8ba3c7; }

  .key-code{
    display:flex; align-items:center; gap:9px;
  }
  .key-code .code{
    font-size:13px; letter-spacing:.03em; color:var(--ink);

    border:1px solid var(--border-soft);

  }
  .icon-btn{
    width:30px; height:30px; border-radius:8px;

  .icon-btn:hover{ color:var(--ink); border-color:rgba(255,255,255,.22); background:rgba(255,255,255,.07); }
  .icon-btn.danger:hover{ color:#fff; border-color:var(--blood); background:var(--blood-dim); }
  .icon-btn.confirm{ color:#fff; background:var(--blood); border-color:var(--blood); animation:shake .35s; }
  @keyframes shake{ 10%,90%{transform:translateX(-1px);} 20%,80%{transform:translateX(2px);} 30%,50%,70%{transform:translateX(-3px);} 40%,60%{transform:translateX(3px);} }

  .badge{

  /* ---------- Mobile cards ---------- */
  .cards{ display:none; }
  .key-card{
    padding:16px; border-bottom:1px solid rgba(255,255,255,.05);

  .key-card-top{ display:flex; align-items:center; justify-content:space-between; }

  /* ---------- Modal ---------- */
  .overlay{

    animation: modalIn .18s cubic-bezier(.2,.9,.3,1.2);

  .modal-head{ display:flex; align-items:center; justify-content:space-between; margin-bottom:18px; }
  .modal-head h2{ margin:0; font-family:'Bebas Neue'; font-size:24px; letter-spacing:.03em; color:var(--ink); }
  .modal-head .close{ background:none; border:none; color:var(--ink-faint); }
  .modal-head .close:hover{ color:var(--ink); }
  .field-label{ font-size:11.5px; letter-spacing:.1em; text-transform:uppercase; color:var(--ink-faint); margin-bottom:9px; display:block; }

  .duration-grid{ display:grid; grid-template-columns:1fr 1fr 1fr; gap:8px; margin-bottom:20px; }
  .dur-opt{
    padding:11px 6px; text-align:center; border-radius:9px;

  }
  .dur-opt.sel{
    color:#fff; border-color:var(--blood-bright);

  }

  .generated-box{
    display:flex; align-items:center; justify-content:space-between; gap:10px;
    background:rgba(51,217,119,.08); border:1px solid rgba(51,217,119,.35);
    border-radius:11px; padding:14px 16px; margin-bottom:16px;
  }
  .generated-box .code{ font-size:14.5px; color:#a9f7c6; word-break:break-all; }

  .activate-instructions{
    background:rgba(255,201,61,.07); border:1px solid rgba(255,201,61,.28);
    border-radius:11px; padding:14px 16px; margin-bottom:16px; font-size:12.5px; color:var(--ink-dim); line-height:1.5;
  }
  .activate-instructions .activate-title{
    display:flex; align-items:center; gap:7px; font-weight:700; color:var(--yellow); margin-bottom:8px; font-size:13px;
  }
  .activate-instructions ol{ margin:0 0 8px 18px; padding:0; }
  .activate-instructions li{ margin-bottom:4px; }
  .activate-instructions .activate-note{ margin:0; color:var(--ink-faint); font-size:11.5px; }

  .badge.product-mod{ background:rgba(138,63,240,.15); color:#c9a6ff; border-color:rgba(138,63,240,.35); }
  .badge.product-flag{ background:rgba(255,75,75,.12); color:#ff8a8a; border-color:rgba(255,75,75,.3); }
  .badge.product-proxy{ background:rgba(51,217,119,.12); color:#7dffb0; border-color:rgba(51,217,119,.35); }
  .dot.pending{ background:#8ba3c7; box-shadow:0 0 10px rgba(139,163,199,.45); }
  .status-txt.pending{ color:#8ba3c7; }

  .full-btn{ width:100%; justify-content:center; }

  .qty-row{ display:flex; gap:8px; flex-wrap:wrap; margin-bottom:14px; }
  .qty-chip{
    padding:8px 12px; border-radius:8px; font-size:12.5px; font-weight:600;
    border:1px solid var(--border-soft); background:rgba(255,255,255,.02); color:var(--ink-dim);
  }
  .qty-chip:hover{ border-color:rgba(255,255,255,.25); color:var(--ink); }
  .num-input{
    width:100%; background:rgba(255,255,255,.03); border:1px solid var(--border-soft);
    border-radius:9px; padding:11px 13px; color:var(--ink); font-size:14px; margin-bottom:16px; outline:none;
  }
  .num-input:focus{ border-color:var(--blood-bright); }
  .edit-current{
    background:rgba(255,255,255,.03); border:1px solid var(--border-soft);
    border-radius:10px; padding:12px 14px; margin-bottom:18px; font-size:13px; color:var(--ink-dim);
  }
  .edit-current .code{ color:var(--ink); font-size:13.5px; margin-bottom:4px; display:block; }
  .row2{ display:flex; gap:10px; }
  .row2 > *{ flex:1; }

  /* ---------- Toasts ---------- */
  .toast-wrap{
    position:fixed; bottom:20px; right:20px; z-index:200;
    display:flex; flex-direction:column; gap:10px; max-width:320px;
  }
  .toast{
    display:flex; align-items:flex-start; gap:10px;
    padding:13px 15px; border-radius:11px;
    background:#140c0c; border:1px solid var(--border-soft);
    box-shadow: var(--shadow-deep);
    font-size:13px; color:var(--ink);
    animation: toastIn .2s ease;
  }
  @keyframes toastIn{ from{opacity:0; transform:translateX(20px);} to{opacity:1; transform:none;} }
  .toast.success{ border-color:rgba(51,217,119,.4); }
  .toast.success .ic{ color:var(--green); }
  .toast.error{ border-color:rgba(255,75,75,.4); }
  .toast.error .ic{ color:var(--red-status); }
  .toast.info{ border-color:rgba(138,63,240,.4); }
  .toast.info .ic{ color:var(--purple); }
  .toast .ic{ flex-shrink:0; margin-top:1px; }

  .footer-note{
    text-align:center; margin-top:30px; font-size:11.5px; color:var(--ink-faint);
  }

  .visually-hidden{ position:absolute; width:1px; height:1px; overflow:hidden; clip:rect(0 0 0 0); }

  button:focus-visible, input:focus-visible, .dur-opt:focus-visible, .chip:focus-visible{

  }

  @media (prefers-reduced-motion: reduce){

  }

  /* ================= NAV TABS ================= */
  .nav-tabs{ display:flex; gap:8px; margin-bottom:20px; }
  .nav-tab{
    display:flex; align-items:center; gap:7px;
    padding:10px 18px; border-radius:10px; border:1px solid var(--border-soft);
    background:rgba(255,255,255,.02); color:var(--ink-faint); font-weight:600; font-size:13px;
  }
  .nav-tab.sel{ color:#fff; border-color:var(--blood-bright); background:linear-gradient(135deg, rgba(255,43,43,.28), rgba(138,20,20,.28)); }

  .avatar-pill{

    border:1px solid var(--border-soft); background:rgba(255,255,255,.03); color:var(--ink-dim); font-size:12.5px; font-weight:600;
  }

  .avatar-pill img{ width:26px; height:26px; border-radius:50%; object-fit:cover; }
  .avatar-pill > svg{ width:26px; height:26px; padding:5px; border-radius:50%; background:rgba(255,255,255,.06); box-sizing:border-box; }
  .role-badge{
    font-size:9.5px; font-weight:800; letter-spacing:.06em; padding:3px 7px; border-radius:5px; color:#fff;
    background:linear-gradient(135deg, var(--blood-bright), var(--purple));
  }

  /* ================= PROFILE MODAL ================= */
  .avatar-big{ width:84px; height:84px; border-radius:50%; object-fit:cover; margin:0 auto 14px; display:block; border:2px solid var(--border-blood); }
  .avatar-big-empty{
    width:84px; height:84px; border-radius:50%; margin:0 auto 14px; display:flex; align-items:center; justify-content:center;

  .profile-row .k{ color:var(--ink-faint); }
  .profile-row .v{ color:var(--ink); font-weight:600; }

  /* ================= CHAT ================= */
  .chat-wrap{
    display:flex; flex-direction:column; height:min(640px, 70vh);
    border:1px solid var(--border-soft); border-radius:var(--radius); background:var(--bg-panel); backdrop-filter: blur(6px); overflow:hidden;
  }

  .chat-avatar-empty{ width:30px; height:30px; border-radius:50%; flex-shrink:0; background:rgba(255,255,255,.08); display:flex; align-items:center; justify-content:center; color:var(--ink-faint); }

  .chat-sender{ font-size:11px; font-weight:700; color:var(--blood-bright); margin-bottom:3px; display:flex; align-items:center; gap:5px; }

  }

  /* ================= AUTH SCREEN (login/cadastro) ================= */
  .auth-shell{
    min-height:100vh; position:relative; overflow:hidden;
    background:#050303;
    background-image:
      linear-gradient(180deg, rgba(5,3,3,.45) 0%, rgba(5,3,3,.82) 55%, #050303 100%),
      radial-gradient(ellipse at 50% 10%, rgba(216,18,18,.2), transparent 55%),
      var(--bg-image);
    background-size:cover; background-position:center 14%; background-repeat:no-repeat;
    display:flex; align-items:center; justify-content:center; padding:24px;
  }
  .auth-blob{ position:fixed; border-radius:42% 58% 65% 35% / 45% 40% 60% 55%; filter:blur(60px); opacity:.32; pointer-events:none; }
  .auth-blob1{ width:640px; height:640px; top:-220px; left:-160px; background:radial-gradient(circle at 35% 30%, #ff2d55, #c8123f 45%, transparent 75%); animation:authFloat1 16s ease-in-out infinite; }
  .auth-blob2{ width:520px; height:520px; top:120px; right:-200px; background:radial-gradient(circle at 60% 40%, #c8123f, #7a0e2c 55%, transparent 78%); border-radius:60% 40% 35% 65% / 55% 60% 40% 45%; animation:authFloat2 20s ease-in-out infinite; }
  .auth-blob3{ width:460px; height:460px; bottom:-200px; left:20%; background:radial-gradient(circle, #7a0e2c, transparent 72%); animation:authFloat1 18s ease-in-out infinite reverse; }
  @keyframes authFloat1{ 0%,100%{transform:translate(0,0) scale(1);} 50%{transform:translate(30px,-25px) scale(1.06);} }
  @keyframes authFloat2{ 0%,100%{transform:translate(0,0) scale(1);} 50%{transform:translate(-25px,30px) scale(1.05);} }

    statusRaw === "ativada" ||

      expiresAt = diasNum;
      activatedAt = Date.now(); // aproximado; o APK guarda só a expiração em dias

      activatedAt = Date.now();
      expiresAt = activatedAt + validadeNum * 24 * 3600 * 1000;
    }

  else if (validadeNum === 3) duration = "3d";
  else if (validadeNum === 7) duration = "7d";

function randSegment(len) {
  const chars = "ABCDEFGHJKLMNPQRSTUVWXYZ23456789";
  let out = "";
  for (let i = 0; i < len; i++) out += chars[Math.floor(Math.random() * chars.length)];
  return out;
}
function generateKeyCode(product) {
  // PROXY / FAKE LAG: formato do gerador SWB (ex: Panico-dp6716)
  if (product === "proxy" || product === "fake_lag") {
    const prefix = product === "fake_lag" ? "Fake" : "Panico";
    return `${prefix}-${randSegment(6).toLowerCase()}`;
  }
  return `PANICO-${randSegment(4)}-${randSegment(4)}-${randSegment(4)}`;
}

const PRODUCT_LABELS = {
  apk_mod: "APK MOD",
  fake_lag: "FAKE LAG",
  proxy: "PROXY",
};

function durationToValidade(durationId, customDays) {
  // validade SEMPRE string numérica (o APK faz Double.parseDouble)
  // vitalícia: valor alto como no gerador original (ex. 5000)
  if (durationId === "lifetime") return "99999";
  if (durationId === "custom" && customDays != null) {
    const n = parseInt(customDays, 10);
    return String(Number.isFinite(n) && n > 0 ? n : 1);
  }
  const map = { "1d": "1", "3d": "3", "7d": "7", "10d": "10", "15d": "15", "30d": "30", "60d": "60", "90d": "90" };
  return map[durationId] || "7";
}

/** Status da key.
 *  - activatedAt == null  → ainda não validada no APK (tempo não começou)
 *  - expiresAt == null + activated → vitalícia
 *  - expiresAt no futuro → ativa / acabando
 *  - expiresAt no passado → expirada
 */
function computeStatus(item, now) {
  const paused = item.paused;
  const activatedAt = item.activatedAt;
  const expiresAt = item.expiresAt;
  if (paused) {
    return { status: "paused", label: "Pausada", detail: "Pausada pelo admin" };
  }
  // Ainda não ativada no APK: tempo não começa a contar
  if (activatedAt === null || activatedAt === undefined) {
    return { status: "pending", label: "Aguardando", detail: "Aguardando 1º acesso no APK" };
  }
  // Ativada e vitalícia
  if (expiresAt === null || expiresAt === undefined) {
    return { status: "green", label: "Vitalícia", detail: "Sem expiração" };
  }
  const diff = expiresAt - now;
  if (diff <= 0) {
    return { status: "red", label: "Expirada", detail: "Tempo esgotado" };
  }
  const hours = diff / 3600000;
  if (hours < 24) {
    const h = Math.max(1, Math.floor(hours));
    return { status: "yellow", label: "Acabando", detail: `Faltam ${h}h` };
  }
  const days = Math.floor(hours / 24);
  return { status: "green", label: "Ativa", detail: `Faltam ${days} dia${days === 1 ? "" : "s"}` };
}

/* Pausa/retoma uma key preservando o tempo restante (congela o relógio). */
function applyPause(id, keyData, pause) {
  const product = keyData.product || "apk_mod";
  const ref = getDbRefForProduct(product);
  const now = Date.now();
  if (isKeysUsersProduct(product)) {
    return ref.child(id).update({ status: pause ? "pausada" : "ativada" });
  }
  if (pause) {
    return ref.child(id).update({ paused: true, pausedAt: now });
  }
  const shift = now - (keyData.pausedAt || now);
  const patch = { paused: false, pausedAt: null };
  if (keyData.expiresAt !== null && keyData.expiresAt !== undefined) patch.expiresAt = keyData.expiresAt + shift;
  return ref.child(id).update(patch);
}

function fmtDate(ts) {
  if (!ts) return "—";
  const d = new Date(ts);
  return d.toLocaleDateString("pt-BR", { day: "2-digit", month: "2-digit", year: "numeric" });
}

/* ---- Copiar com fallback (clipboard API falha em contexto não seguro / file://) ---- */
function copyToClipboard(text) {
  return new Promise((resolve, reject) => {
    if (navigator.clipboard && window.isSecureContext) {
      navigator.clipboard.writeText(text).then(resolve).catch(() => fallbackCopy(text, resolve, reject));
    } else {
      fallbackCopy(text, resolve, reject);
    }
  });
}
function fallbackCopy(text, resolve, reject) {
  try {
    const ta = document.createElement("textarea");
    ta.value = text;
    ta.style.position = "fixed";
    ta.style.opacity = "0";
    document.body.appendChild(ta);
    ta.focus();
    ta.select();
    const ok = document.execCommand("copy");
    document.body.removeChild(ta);
    ok ? resolve() : reject(new Error("execCommand falhou"));
  } catch (e) {
    reject(e);
  }
}

/* ---- Redimensiona uma imagem (arquivo) para um data URL menor, via canvas ---- */
function resizeImageFile(file, maxSize = 160, quality = 0.82) {
  return new Promise((resolve, reject) => {
    if (file.type === "image/gif") {
      // GIFs animados: canvas perderia a animação, então mantemos o arquivo original (com limite de tamanho).
      if (file.size > 3 * 1024 * 1024) { reject(new Error("GIF muito grande (máx. 3MB).")); return; }
      const reader = new FileReader();
      reader.onload = () => resolve(reader.result);
      reader.onerror = reject;
      reader.readAsDataURL(file);
      return;
    }
    const img = new Image();
    const reader = new FileReader();
    reader.onload = () => {
      img.onload = () => {
        let { width, height } = img;
        if (width > height) { if (width > maxSize) { height *= maxSize / width; width = maxSize; } }
        else { if (height > maxSize) { width *= maxSize / height; height = maxSize; } }
        const canvas = document.createElement("canvas");
        canvas.width = width; canvas.height = height;
        const ctx = canvas.getContext("2d");
        ctx.drawImage(img, 0, 0, width, height);
        resolve(canvas.toDataURL(file.type === "image/webp" ? "image/webp" : "image/jpeg", quality));
      };
      img.onerror = reject;
      img.src = reader.result;
    };
    reader.onerror = reject;
    reader.readAsDataURL(file);
  });
}
function fileToDataUrl(file, maxBytes = 5 * 1024 * 1024) {
  return new Promise((resolve, reject) => {
    if (file.size > maxBytes) { reject(new Error(`Arquivo muito grande (máx. ${Math.round(maxBytes/1024)}KB).`)); return; }
    const reader = new FileReader();
    reader.onload = () => resolve(reader.result);
    reader.onerror = reject;
    reader.readAsDataURL(file);
  });
}

/* ============ Toasts ============ */
let toastId = 0;
function useToasts() {
  const [toasts, setToasts] = useState([]);
  const push = useCallback((message, type = "success") => {
    const id = ++toastId;
    setToasts((t) => [...t, { id, message, type }]);
    setTimeout(() => setToasts((t) => t.filter((x) => x.id !== id)), 3200);
  }, []);
  return { toasts, push };
}

function ToastIcon({ type }) {
  if (type === "success") return <Icon name="check" size={16} />;
  if (type === "error") return <Icon name="alert" size={16} />;
  return <Icon name="zap" size={16} />;
}

function ToastStack({ toasts }) {
  return (
    <div className="toast-wrap" aria-live="polite">
      {toasts.map((t) => (
        <div key={t.id} className={`toast ${t.type}`}>
          <span className="ic"><ToastIcon type={t.type} /></span>
          <span>{t.message}</span>
        </div>
      ))}
    </div>
  );
}

function EditModal({ item, onClose, onSave }) {
  const [deltaDays, setDeltaDays] = useState(0);

  const applyDelta = (n) => setDeltaDays((d) => d + n);

  const notActivated = item.activatedAt === null || item.activatedAt === undefined;
  const isLifetime = !notActivated && (item.expiresAt === null || item.expiresAt === undefined);

  const saveChange = (newExpiresAt) => {
    onSave(item.id, newExpiresAt, item.product);
    onClose();
  };

  const handleSave = () => {
    const base = notActivated || isLifetime ? Date.now() : item.expiresAt;
    const newExpiresAt = base + deltaDays * 24 * 3600 * 1000;
    saveChange(newExpiresAt);
  };

  const makeLifetime = () => saveChange(null);
  const revokeNow = () => saveChange(Date.now() - 1000);

  return (
    <div className="overlay" onMouseDown={(e) => e.target === e.currentTarget && onClose()}>
      <div className="modal" role="dialog" aria-modal="true" aria-label="Editar key">

        </div>

        <div className="edit-current">
          <span className="code mono">{item.code}</span>
          {notActivated
            ? "Aguardando 1º acesso no APK (tempo ainda não começou)"
            : isLifetime
              ? "Licença vitalícia"
              : `Expira em: ${fmtDate(item.expiresAt)}`}

        <span className="field-label">Ajustar dias (some ou remova)</span>
        <div className="qty-row">
          <button className="qty-chip" onClick={() => applyDelta(-7)}>-7</button>
          <button className="qty-chip" onClick={() => applyDelta(-1)}>-1</button>
          <button className="qty-chip" onClick={() => applyDelta(1)}>+1</button>
          <button className="qty-chip" onClick={() => applyDelta(7)}>+7</button>
          <button className="qty-chip" onClick={() => applyDelta(30)}>+30</button>
        </div>
        <input
          type="number"

          value={deltaDays}
          onChange={(e) => setDeltaDays(parseInt(e.target.value || "0", 10))}

        <div className="row2" style={{ marginBottom: 10 }}>
          <button className="btn btn-ghost full-btn" onClick={makeLifetime}>
            <Icon name="infinity" size={15} /> Tornar vitalícia
          </button>
          <button className="btn btn-ghost full-btn" onClick={revokeNow}>
            <Icon name="shieldOff" size={15} /> Expirar agora

        </button>

    </div>
  );

function useConfirm() {
  const [confirming, setConfirming] = useState(false);
  const timer = useRef(null);
  const trigger = (fn) => {
    if (confirming) {
      clearTimeout(timer.current);
      setConfirming(false);
      fn();
    } else {
      setConfirming(true);
      timer.current = setTimeout(() => setConfirming(false), 3000);
    }
  };
  return { confirming, trigger };
}

/* ============ Main App ============ */
function App({ currentUser, onLogout }) {
  const [keys, setKeys] = useState([]);
  const [loading, setLoading] = useState(true);
  const [connected, setConnected] = useState(false);
  const [permIssue, setPermIssue] = useState(false);
  const [bannerDismissed, setBannerDismissed] = useState(false);
  const [now, setNow] = useState(Date.now());
  const [search, setSearch] = useState("");
  const [filter, setFilter] = useState("all");
  const [productTab, setProductTab] = useState("apk_mod"); // apk_mod | proxy | fake_lag
  const [showGenerate, setShowGenerate] = useState(false);
  const [editItem, setEditItem] = useState(null);
  const [showProfile, setShowProfile] = useState(false);
  const [me, setMe] = useState(currentUser);
  const [credits, setCredits] = useState(null);
  const { toasts, push } = useToasts();
  const synced = useRef(false); // já recebemos ao menos 1 snapshot real do Firebase
  const isAdmin = me.role === "dono" || me.role === "super";

  useEffect(() => {
    const t = setInterval(() => setNow(Date.now()), 30000);
    return () => clearInterval(t);
  }, []);

  // Saldo de créditos do revendedor vinculado à conta (ao vivo)
  useEffect(() => {
    if (!authDbAvailable || !me.resellerKey) return;
    const handler = (snap) => {
      const val = snap.val();
      if (!val) { setCredits(null); return; }
      const [, reseller] = Object.entries(val)[0];
      setCredits(reseller.balance);
    };
    const q = resellersRef.orderByChild("resellerKey").equalTo(me.resellerKey);
    q.on("value", handler);
    return () => q.off("value", handler);
  }, [me.resellerKey]);

  // Sincroniza APK MOD + FAKE LAG + PROXY em paralelo e mescla na tela.
  useEffect(() => {
    if (!fbAvailable) { setLoading(false); return; }
    let modList = [];
    let flagList = [];
    let proxyList = [];
    let gotAny = false;

    const mergeAndSet = () => {
      const list = [...modList, ...flagList, ...proxyList].sort((a, b) => (b.createdAt || 0) - (a.createdAt || 0));
      if (gotAny) {
        synced.current = true;
        setKeys(list);
        setLoading(false);
        setConnected(true);
        setPermIssue(false);
      }
    };

    const makeHandler = (product) => (snap) => {
      const val = snap.val() || {};
      let list;
      if (isKeysUsersProduct(product)) {
        list = Object.entries(val).map(([id, v]) => mapKeysUsersRecord(id, v, product));
      } else {
        list = Object.entries(val).map(([id, v]) => {
          let activatedAt = v.activatedAt;
          if (activatedAt === undefined) {
            activatedAt = (v.expiresAt !== undefined && v.expiresAt !== null) ? (v.createdAt || 0) : null;
          }
          return { ...v, id, product: v.product || product, activatedAt };
        });
      }
      if (product === "apk_mod") modList = list;
      else if (product === "fake_lag") flagList = list;
      else proxyList = list;
      gotAny = true;
      mergeAndSet();
    };
    const errHandler = (err) => {
      console.error(err);
      setConnected(false);
      setLoading(false);
      setPermIssue(true);
    };

    if (modDbRef) modDbRef.on("value", makeHandler("apk_mod"), errHandler);
    if (fakeLagDbRef) fakeLagDbRef.on("value", makeHandler("fake_lag"), errHandler);
    if (proxyDbRef) proxyDbRef.on("value", makeHandler("proxy"), errHandler);
    return () => {
      if (modDbRef) modDbRef.off("value");
      if (fakeLagDbRef) fakeLagDbRef.off("value");
      if (proxyDbRef) proxyDbRef.off("value");
    };
    // eslint-disable-next-line
  }, []);

  const copyCode = (code) => {
    copyToClipboard(code)
      .then(() => push("Key copiada para a área de transferência!", "success"))
      .catch(() => push("Não foi possível copiar automaticamente. Selecione a key manualmente.", "error"));
  };

  /** Consome créditos da key de revenda (1 crédito por key gerada). */
  const consumeCredits = (amount) => {
    return new Promise((resolve, reject) => {
      if (!amount || amount < 1) return resolve(true);
      if (!authDbAvailable || !resellersRef) {
        if (isAdmin) return resolve(true);
        return reject(new Error("Serviço de créditos indisponível."));
      }
      if (!me.resellerKey) {
        if (isAdmin) return resolve(true);
        return reject(new Error("Sua conta não tem key de revenda vinculada."));
      }
      resellersRef.orderByChild("resellerKey").equalTo(me.resellerKey).once("value")
        .then((snap) => {
          const val = snap.val();
          if (!val) return reject(new Error("Key de revenda não encontrada."));
          const [resellerId, reseller] = Object.entries(val)[0];
          const bal = Number(reseller.balance) || 0;
          if (bal < amount) {
            return reject(new Error(`Créditos insuficientes (${bal}). Precisa de ${amount}.`));
          }
          const next = bal - amount;
          return resellersRef.child(resellerId).update({ balance: next }).then(() => {
            setCredits(next);
            resolve(true);
          });
        })
        .catch((err) => {
          console.error(err);
          reject(new Error("Erro ao debitar créditos."));
        });
    });
  };

  const generateKey = async (durationId, product = "apk_mod", opts = {}) => {
    const targetRef = getDbRefForProduct(product);
    const now2 = Date.now();
    const count = isKeysUsersProduct(product)
      ? Math.max(1, Math.min(50, parseInt(opts.qty, 10) || 1))
      : 1;

    // Debita créditos ANTES de gerar
    try {
      await consumeCredits(count);
    } catch (err) {
      push(err.message || "Não foi possível usar os créditos.", "error");
      return null;
    }

    // ----- PROXY / FAKE LAG (estrutura KeysUsers do SWB) -----
    if (isKeysUsersProduct(product)) {
      const dispositivos = opts.dispositivos || "Livre";
      const validade = durationToValidade(durationId, opts.customDays);
      const daysNum = parseInt(validade, 10) || 0;
      const durationMs = daysNum > 0 ? daysNum * 24 * 3600 * 1000 : null;
      const codes = [];
      const localRecords = [];

      for (let i = 0; i < count; i++) {
        const code = generateKeyCode(product);
        codes.push(code);
        const tempId = "local-" + now2 + "-" + i + "-" + Math.floor(Math.random() * 9999);
        localRecords.push({
          id: tempId,
          code,
          duration: durationId === "custom" ? `${daysNum}d` : durationId,
          durationMs,
          createdAt: now2,
          activatedAt: null,
          expiresAt: null,
          owner: me.username,
          product,
          paused: false,
          proxyDispositivos: dispositivos,
          proxyValidade: validade,
        });

        if (fbAvailable && targetRef) {
          const newRef = targetRef.push();
          newRef.set({
            key: code,
            status: "",
            dias: "0",
            validade: String(validade),
            dispositivos: String(dispositivos || "Livre"),
            device: "",
            uid: newRef.key,
          }).catch((err) => {
            console.error(err);
            setPermIssue(true);
          });
        }
      }

      if (!fbAvailable || !targetRef) {
        setKeys((k) => [...localRecords, ...k]);
        setPermIssue(true);
      }
      push(
        count > 1
          ? `${count} keys ${PRODUCT_LABELS[product]} geradas (−${count} créditos)!`
          : `Key ${PRODUCT_LABELS[product]} gerada (−1 crédito)!`,
        "success"
      );
      return count === 1 ? codes[0] : codes;
    }

    // ----- APK MOD -----
    const durObj = DURATIONS.find((d) => d.id === durationId) || DURATIONS[2];
    const code = generateKeyCode(product);
    const tempId = "local-" + now2 + "-" + Math.floor(Math.random() * 9999);
    const record = {
      id: tempId,
      code,
      duration: durationId,
      durationMs: durObj.ms,
      createdAt: now2,
      activatedAt: null,
      expiresAt: null,
      owner: me.username,
      product,
      paused: false,
    };

    if (!fbAvailable || !targetRef) {
      setKeys((k) => [record, ...k]);
      setPermIssue(true);
    } else {
      targetRef.push({
        code,
        duration: durationId,
        durationMs: durObj.ms,
        createdAt: now2,
        activatedAt: null,
        expiresAt: null,
        owner: me.username,
        product,
        paused: false,
      }).catch((err) => {
        console.error(err);
        setPermIssue(true);
        setKeys((k) => [record, ...k]);
        push("Gerada localmente, mas não foi salva no Firebase (sem permissão).", "error");
      });
    }
    push(`Key ${PRODUCT_LABELS[product] || product} gerada (−1 crédito)!`, "success");
    return code;
  };

  const editKey = (id, newExpiresAt, product) => {
    const now2 = Date.now();
    setKeys((list) => list.map((k) => (k.id === id ? { ...k, expiresAt: newExpiresAt, activatedAt: k.activatedAt || now2 } : k)));
    push("Key atualizada com sucesso!", "success");
    const ref = getDbRefForProduct(product || "apk_mod");
    if (fbAvailable && ref && !String(id).startsWith("local-")) {
      if (isKeysUsersProduct(product)) {
        // dias sempre numérico: timestamp de expiração ou valor alto se vitalícia
        const patch = {
          status: "ativada",
          dias: newExpiresAt === null ? "4102444800000" : String(newExpiresAt),
        };
        ref.child(id).update(patch)
          .catch((err) => { console.error(err); setPermIssue(true); push("Alterado localmente, mas não sincronizado com o Firebase.", "error"); });
      } else {
        const patch = { expiresAt: newExpiresAt };
        ref.child(id).once("value").then((snap) => {
          const cur = snap.val() || {};
          if (cur.activatedAt === null || cur.activatedAt === undefined) patch.activatedAt = now2;
          return ref.child(id).update(patch);
        }).catch((err) => { console.error(err); setPermIssue(true); push("Alterado localmente, mas não sincronizado com o Firebase.", "error"); });
      }
    } else if (fbAvailable) {
      setPermIssue(true);
    }
  };

  const deleteKey = (item) => {
    setKeys((list) => list.filter((k) => k.id !== item.id));
    push("Key deletada / acesso revogado.", "success");
    const ref = getDbRefForProduct(item.product || "apk_mod");
    if (fbAvailable && ref && !String(item.id).startsWith("local-")) {
      ref.child(item.id).remove()
        .catch((err) => { console.error(err); setPermIssue(true); push("Removida localmente, mas não sincronizada com o Firebase.", "error"); });
    } else if (fbAvailable) {
      setPermIssue(true);
    }
  };

  const toggleKeyPause = (item) => {
    const pause = !item.paused;
    const now2 = Date.now();
    setKeys((list) => list.map((k) => {
      if (k.id !== item.id) return k;
      if (pause) return { ...k, paused: true, pausedAt: now2 };
      const shift = now2 - (k.pausedAt || now2);
      return { ...k, paused: false, pausedAt: null, expiresAt: k.expiresAt === null || k.expiresAt === undefined ? null : k.expiresAt + shift };
    }));
    push(pause ? "Key pausada." : "Key retomada.", "success");
    if (fbAvailable && !String(item.id).startsWith("local-")) {
      applyPause(item.id, item, pause).catch((err) => { console.error(err); push("Alterado localmente, mas não sincronizado.", "error"); });
    }
  };

  const pauseAll = (pause) => {
    const now2 = Date.now();
    const tab = productTab || "apk_mod";
    // Só altera keys da aba atual
    setKeys((list) => list.map((k) => {
      if ((k.product || "apk_mod") !== tab) return k;
      if (pause && !k.paused) return { ...k, paused: true, pausedAt: now2 };
      if (!pause && k.paused) {
        const shift = now2 - (k.pausedAt || now2);
        return { ...k, paused: false, pausedAt: null, expiresAt: k.expiresAt === null || k.expiresAt === undefined ? null : k.expiresAt + shift };
      }
      return k;
    }));
    const label = PRODUCT_LABELS[tab] || tab;
    push(pause ? `Keys de ${label} pausadas.` : `Keys de ${label} retomadas.`, "success");
    if (!fbAvailable) return;

    const ref = getDbRefForProduct(tab);
    if (!ref) return;
    const isKU = isKeysUsersProduct(tab);

    ref.once("value").then((snap) => {
      const val = snap.val() || {};
      const updates = {};
      Object.entries(val).forEach(([id, k]) => {
        if (isKU) {
          const st = (k.status || "").toLowerCase();
          if (pause && st !== "pausada") updates[`${id}/status`] = "pausada";
          if (!pause && st === "pausada") updates[`${id}/status`] = "ativada";
        } else {
          if (pause && !k.paused) { updates[`${id}/paused`] = true; updates[`${id}/pausedAt`] = now2; }
          if (!pause && k.paused) {
            const shift = now2 - (k.pausedAt || now2);
            updates[`${id}/paused`] = false;
            updates[`${id}/pausedAt`] = null;
            if (k.expiresAt !== null && k.expiresAt !== undefined) updates[`${id}/expiresAt`] = k.expiresAt + shift;
          }
        }
      });
      if (Object.keys(updates).length) ref.update(updates).catch((err) => console.error(err));
    });
  };

  // Filtra pelo produto da aba + usuários comuns só enxergam as próprias keys.
  const myKeys = useMemo(() => {
    let list = keys.filter((k) => (k.product || "apk_mod") === productTab);
    if (!isAdmin) list = list.filter((k) => k.owner === me.username);
    return list;
  }, [keys, isAdmin, me.username, productTab]);

  const stats = useMemo(() => {
    let active = 0, warn = 0, expired = 0, paused = 0, pending = 0;
    myKeys.forEach((k) => {
      const s = computeStatus(k, now);
      if (s.status === "paused") paused++;
      else if (s.status === "pending") pending++;
      else if (s.status === "green") active++;
      else if (s.status === "yellow") warn++;
      else expired++;
    });
    return { total: myKeys.length, active, warn, expired, paused, pending };
  }, [myKeys, now]);

  const filtered = useMemo(() => {
    return myKeys.filter((k) => {
      if (search && !k.code.toLowerCase().includes(search.toLowerCase())) return false;
      if (filter === "all") return true;
      const s = computeStatus(k, now).status;
      if (filter === "active") return s === "green";
      if (filter === "warn") return s === "yellow";
      if (filter === "expired") return s === "red";
      if (filter === "paused") return s === "paused";
      if (filter === "pending") return s === "pending";
      return true;
    });
  }, [myKeys, search, filter, now]);

  return (
    <div className="app">
      <header className="header">
        <div className="brand">
          <div className="brand-mark"><Icon name="skull" size={24} style={{ color: "var(--blood-bright)" }} /></div>
          <div className="brand-title">
            <div className="t1">PÂNICO <span className="sub">CHEATS</span></div>
            <div className="tag">Painel de Licenças</div>
          </div>
        </div>
        <div className="header-actions">
          <div className="conn-pill">
            <span className={`conn-dot ${connected ? "ok" : "bad"}`}></span>
            {connected ? "Firebase conectado" : "Firebase offline"}
          </div>
          {credits !== null && (
            <div className="conn-pill" title="Créditos restantes na sua key de revenda">
              <Icon name="coins" size={13} /> {credits} créditos
            </div>
          )}
          <button className="avatar-pill" onClick={() => setShowProfile(true)}>
            {me.avatar ? <img src={me.avatar} alt="" /> : <Icon name="user" size={14} />}
            <span>{me.username}</span>
            {isAdmin && <span className={`role-badge ${me.role}`}>{me.role === "dono" ? "DONO" : "SUPER"}</span>}
          </button>
          <button className="btn btn-ghost" onClick={onLogout}>
            <Icon name="logout" size={15} /> Sair
          </button>
          <button className="btn btn-primary" onClick={() => setShowGenerate(true)}>
            <Icon name="plus" size={16} /> Gerar Key
          </button>
        </div>
      </header>

      <div className="nav-tabs" style={{ marginTop: 4 }}>
        {[
          ["apk_mod", "APK MOD"],
          ["proxy", "PROXY"],
          ["fake_lag", "FAKE LAG"],
        ].map(([id, label]) => (
          <button
            key={id}
            className={`nav-tab ${productTab === id ? "sel" : ""}`}
            onClick={() => { setProductTab(id); setFilter("all"); }}
          >
            {label}
          </button>
        ))}
      </div>

      <div className="hero-cover" role="img" aria-label="Pânico Cheats — capa">
        <div className="hero-inner">
          <div className="hero-txt">
            <div className="k1">{PRODUCT_LABELS[productTab]}</div>
            <div className="k2">GERENCIAMENTO DE LICENÇAS</div>
          </div>
          <button className="btn btn-primary" onClick={() => setShowGenerate(true)}>
            <Icon name="plus" size={16} /> Gerar Key
          </button>
        </div>
      </div>

      {permIssue && !bannerDismissed && (
        <div className="perm-banner">
          <Icon name="alert" size={18} />
          <div className="txt">
            As keys estão funcionando normalmente aqui na tela, mas não estão sendo salvas no Firebase.
            Abra o console do Firebase → Realtime Database → Regras e defina <code>{'{"rules": {".read": true, ".write": true}}'}</code> para liberar a gravação.
          </div>
          <button className="close" onClick={() => setBannerDismissed(true)} aria-label="Fechar aviso"><Icon name="x" size={16} /></button>
        </div>
      )}

      <div className="stats">
        <div className="stat total"><span className="num">{stats.total}</span><span className="lbl">Total de keys</span></div>
        <div className="stat active"><span className="num">{stats.active}</span><span className="lbl">Ativas</span></div>
        <div className="stat warn"><span className="num">{stats.warn}</span><span className="lbl">Expirando</span></div>
        <div className="stat expired"><span className="num">{stats.expired}</span><span className="lbl">Expiradas</span></div>
        <div className="stat"><span className="num" style={{ color: "#8ba3c7" }}>{stats.pending}</span><span className="lbl">Aguardando</span></div>
        <div className="stat"><span className="num" style={{ color: "#8ba3c7" }}>{stats.paused}</span><span className="lbl">Pausadas</span></div>
      </div>

      <div className="toolbar">
        <div className="search">
          <Icon name="search" size={15} />
          <input
            placeholder="Buscar por código da key..."
            value={search}
            onChange={(e) => setSearch(e.target.value)}
          />
        </div>
        <div className="filters">
          {[
            ["all", "Todas"],
            ["active", "Ativas"],
            ["pending", "Aguardando"],
            ["warn", "Expirando"],
            ["expired", "Expiradas"],
            ["paused", "Pausadas"],
          ].map(([id, label]) => (
            <button key={id} className={`chip ${filter === id ? "active" : ""}`} onClick={() => setFilter(id)}>
              {label}
            </button>
          ))}
        </div>
        {isAdmin && (
          <>
            <button className="btn btn-ghost" onClick={() => pauseAll(true)}><Icon name="clock" size={14} /> Pausar {PRODUCT_LABELS[productTab] || "todas"}</button>
            <button className="btn btn-ghost" onClick={() => pauseAll(false)}><Icon name="zap" size={14} /> Retomar {PRODUCT_LABELS[productTab] || "todas"}</button>
          </>
        )}
      </div>

      <div className="panel">
        {loading ? (
          <div className="empty">
            <div className="display">CARREGANDO...</div>
            <p>Sincronizando com o banco de dados.</p>
          </div>
        ) : filtered.length === 0 ? (
          <div className="empty">
            <Icon name="inbox" size={36} style={{ color: "var(--ink-faint)", marginBottom: 10 }} />
            <div className="display">NENHUMA KEY ENCONTRADA</div>
            <p>{keys.length === 0 ? "Gere a primeira licença para começar." : "Ajuste a busca ou o filtro selecionado."}</p>
            {keys.length === 0 && (
              <button className="btn btn-primary" onClick={() => setShowGenerate(true)}>
                <Icon name="plus" size={16} /> Gerar Key
              </button>
            )}
          </div>
        ) : (
          <>
            <table className="table">
              <thead>
                <tr>
                  <th>Status</th>
                  <th>Produto</th>
                  <th>Key</th>
                  <th>Duração</th>
                  {isAdmin && <th>Dono</th>}
                  <th>Criada em</th>
                  <th>Expira em</th>
                  <th style={{ textAlign: "right" }}>Ações</th>
                </tr>
              </thead>
              <tbody>
                {filtered.map((item) => {
                  const isLifetime = item.duration === "lifetime" || (item.activatedAt && (item.expiresAt === null || item.expiresAt === undefined));
                  const product = item.product || "apk_mod";
                  return (
                  <tr key={`${product}-${item.id}`}>
                    <td><StatusBits item={item} now={now} /></td>
                    <td>
                      <span className={`badge ${product === "fake_lag" ? "product-flag" : product === "proxy" ? "product-proxy" : "product-mod"}`}>
                        {PRODUCT_LABELS[product] || product}
                      </span>
                    </td>
                    <td>
                      <div className="key-code">
                        <span className="code mono">{item.code}</span>
                      </div>
                    </td>
                    <td>
                      <div style={{ display: "flex", flexWrap: "wrap", gap: 6 }}>
                        {isLifetime ? (
                          <span className="badge lifetime"><Icon name="infinity" size={11} /> Vitalícia</span>
                        ) : (
                          <span className="badge">{durationLabel(item.duration)}</span>
                        )}
                        {isKeysUsersProduct(product) && item.proxyDispositivos && (
                          <span className={`badge ${product === "fake_lag" ? "product-flag" : "product-proxy"}`}>
                            {item.proxyDispositivos === "Livre" ? "Disp. Livre" : `${item.proxyDispositivos} disp.`}
                          </span>
                        )}
                      </div>
                    </td>
                    {isAdmin && <td style={{ color: "var(--ink-dim)" }}>{item.owner || "—"}</td>}
                    <td>{fmtDate(item.createdAt)}</td>
                    <td>
                      {!item.activatedAt
                        ? "Após 1º acesso"
                        : item.expiresAt
                          ? fmtDate(item.expiresAt)
                          : "—"}
                    </td>
                    <td>
                      <div className="actions-cell">
                        <KeyActions item={item} onEdit={setEditItem} onDelete={deleteKey} onCopy={copyCode} onTogglePause={toggleKeyPause} isAdmin={isAdmin} />
                      </div>
                    </td>
                  </tr>
                  );
                })}
              </tbody>
            </table>

            <div className="cards">
              {filtered.map((item) => {
                const isLifetime = item.duration === "lifetime" || (item.activatedAt && (item.expiresAt === null || item.expiresAt === undefined));
                const product = item.product || "apk_mod";
                return (
                <div className="key-card" key={`${product}-${item.id}`}>
                  <div className="key-card-top">
                    <StatusBits item={item} now={now} />
                    <span className={`badge ${product === "fake_lag" ? "product-flag" : product === "proxy" ? "product-proxy" : "product-mod"}`}>
                      {PRODUCT_LABELS[product] || product}
                    </span>
                    {isLifetime ? (
                      <span className="badge lifetime"><Icon name="infinity" size={11} /> Vitalícia</span>
                    ) : (
                      <span className="badge">{durationLabel(item.duration)}</span>
                    )}
                  </div>
                  <span className="code mono" style={{ width: "fit-content" }}>{item.code}</span>
                  <div className="key-card-meta">
                    <span>Criada: {fmtDate(item.createdAt)}</span>
                    <span>•</span>
                    <span>
                      Expira:{" "}
                      {!item.activatedAt
                        ? "Após 1º acesso"
                        : item.expiresAt
                          ? fmtDate(item.expiresAt)
                          : "—"}
                    </span>
                  </div>
                  <div className="key-card-actions">
                    <KeyActions item={item} onEdit={setEditItem} onDelete={deleteKey} onCopy={copyCode} onTogglePause={toggleKeyPause} isAdmin={isAdmin} />
                  </div>
                </div>
                );
              })}
            </div>
          </>
        )}
      </div>

      <div className="footer-note">PÂNICO CHEATS © {new Date().getFullYear()} — Painel interno de gerenciamento de licenças.</div>

      {showProfile && (
        <ProfileModal
          me={me}
          isAdmin={isAdmin}
          credits={credits}
          keysCount={myKeys.length}
          onClose={() => setShowProfile(false)}
          onUpdate={(patch) => {
            setMe((m) => {
              const next = { ...m, ...patch };
              saveSession(next);
              return next;
            });
            if (authDbAvailable && me.id) usersRef.child(me.id).update(patch).catch((e) => console.error(e));
          }}
          push={push}
        />
      )}

      {showGenerate && (
        <GenerateModal
          product={productTab}
          onClose={() => setShowGenerate(false)}
          onGenerate={generateKey}
          onCopy={copyCode}
        />
      )}
      {editItem && (
        <EditModal item={editItem} onClose={() => setEditItem(null)} onSave={editKey} />
      )}

      <ToastStack toasts={toasts} />
    </div>
  );
}

/* ============ Profile Modal ============ */
function ProfileModal({ me, isAdmin, credits, keysCount, onClose, onUpdate, push }) {
  const [uploading, setUploading] = useState(false);
  const [editing, setEditing] = useState(false);
  const [newUsername, setNewUsername] = useState(me.username);
  const [newPassword, setNewPassword] = useState("");
  const [currentPassword, setCurrentPassword] = useState("");
  const [saving, setSaving] = useState(false);
  const [error, setError] = useState("");
  const fileRef = useRef(null);

  const pickAvatar = () => fileRef.current && fileRef.current.click();

  const onAvatarFile = (e) => {
    const file = e.target.files && e.target.files[0];
    if (!file) return;
    setUploading(true);
    resizeImageFile(file, 160, 0.85)
      .then((dataUrl) => { onUpdate({ avatar: dataUrl }); push("Avatar atualizado!", "success"); })
      .catch((err) => push(err.message || "Erro ao processar a imagem.", "error"))
      .finally(() => setUploading(false));
  };

  const saveProfile = () => {
    setError("");
    if (!currentPassword) { setError("Digite sua senha atual para confirmar."); return; }
    if (!authDbAvailable || !me.id) { setError("Serviço indisponível no momento."); return; }
    setSaving(true);
    usersRef.child(me.id).once("value")
      .then((snap) => {
        const val = snap.val();
        if (!val) { setError("Conta não encontrada."); setSaving(false); return; }
        if (val.password !== currentPassword) { setError("Senha atual incorreta."); setSaving(false); return; }

        const finish = (patch) => {
          if (Object.keys(patch).length === 0) { setSaving(false); setEditing(false); return; }
          usersRef.child(me.id).update(patch)
            .then(() => {
              onUpdate(patch);
              push("Perfil atualizado com sucesso!", "success");
              setEditing(false);
              setNewPassword("");
              setCurrentPassword("");
            })
            .catch((err) => { console.error(err); setError("Erro ao salvar. Tente novamente."); })
            .finally(() => setSaving(false));
        };

        const patch = {};
        if (newPassword.trim()) patch.password = newPassword.trim();
        const uname = newUsername.trim();
        if (uname && uname !== me.username) {
          usersRef.orderByChild("username").equalTo(uname).once("value").then((usnap) => {
            const uval = usnap.val();
            const clash = uval && Object.keys(uval).some((id) => id !== me.id);
            if (clash) { setError("Esse nome de usuário já está em uso."); setSaving(false); return; }
            patch.username = uname;
            finish(patch);
          });
        } else {
          finish(patch);
        }
      })
      .catch((err) => { console.error(err); setError("Erro ao verificar a senha atual."); setSaving(false); });
  };

  return (
    <div className="overlay" onMouseDown={(e) => e.target === e.currentTarget && onClose()}>
      <div className="modal" role="dialog" aria-modal="true" aria-label="Perfil">
        <div className="modal-head">
          <h2>MEU PERFIL</h2>
          <button className="close" onClick={onClose} aria-label="Fechar"><Icon name="x" /></button>
        </div>

        {me.avatar ? (
          <img src={me.avatar} className="avatar-big" alt="" />
        ) : (
          <div className="avatar-big-empty"><Icon name="user" size={32} /></div>
        )}
        <input ref={fileRef} type="file" accept="image/*" style={{ display: "none" }} onChange={onAvatarFile} />
        <button className="btn btn-ghost full-btn" onClick={pickAvatar} disabled={uploading} style={{ marginBottom: 18 }}>
          <Icon name="upload" size={15} /> {uploading ? "Enviando..." : "Alterar avatar"}
        </button>

        {!editing ? (
          <>
            <div className="profile-row"><span className="k">Usuário</span><span className="v">{me.username}</span></div>
            <div className="profile-row"><span className="k">Gmail</span><span className="v">{me.gmail || "—"}</span></div>
            <div className="profile-row"><span className="k">Cargo</span><span className="v">{me.role === "dono" ? "Dono" : me.role === "super" ? "Super usuário" : "Usuário"}</span></div>
            <div className="profile-row"><span className="k">Key de revenda</span><span className="v mono">{me.resellerKey || "—"}</span></div>
            <div className="profile-row"><span className="k">Créditos restantes</span><span className="v">{credits === null ? "—" : credits}</span></div>
            <div className="profile-row"><span className="k">Keys geradas</span><span className="v">{keysCount}</span></div>
            <button className="btn btn-primary full-btn" onClick={() => setEditing(true)} style={{ marginTop: 16 }}>
              <Icon name="edit" size={15} /> Editar usuário e senha
            </button>
          </>
        ) : (
          <>
            {error && <div className="auth-error">{error}</div>}
            <span className="field-label">Novo usuário</span>
            <input className="num-input" value={newUsername} onChange={(e) => setNewUsername(e.target.value)} placeholder="Usuário" />
            <span className="field-label">Nova senha (deixe em branco para manter)</span>
            <input className="num-input" type="password" value={newPassword} onChange={(e) => setNewPassword(e.target.value)} placeholder="Nova senha" />
            <span className="field-label">Senha atual (obrigatória para confirmar)</span>
            <input className="num-input" type="password" value={currentPassword} onChange={(e) => setCurrentPassword(e.target.value)} placeholder="Senha atual" />
            <div className="row2">
              <button className="btn btn-ghost full-btn" onClick={() => { setEditing(false); setError(""); setNewUsername(me.username); setNewPassword(""); setCurrentPassword(""); }}>
                Cancelar
              </button>
              <button className="btn btn-primary full-btn" onClick={saveProfile} disabled={saving}>
                <Icon name="check" size={15} /> {saving ? "Salvando..." : "Salvar"}
              </button>
            </div>
          </>
        )}
      </div>
    </div>
  );
}

/* ============ Auth Screen (login / cadastro) ============ */
function AuthScreen({ onSuccess }) {
  const [tab, setTab] = useState("login");
  const [loading, setLoading] = useState(false);
  const [error, setError] = useState("");

  const [lu, setLu] = useState("");
  const [lp, setLp] = useState("");
  const [su, setSu] = useState("");
  const [sp, setSp] = useState("");
  const [sg, setSg] = useState("");
  const [sk, setSk] = useState("");

  const switchTab = (t) => { setTab(t); setError(""); };

  const doLogin = () => {
    setError("");
    if (!lu.trim() || !lp) { setError("Preencha usuário e senha."); return; }
    if (!authDbAvailable) { setError("Serviço de login indisponível no momento."); return; }
    setLoading(true);
    usersRef.orderByChild("username").equalTo(lu.trim()).once("value")
      .then((snap) => {
        const val = snap.val();
        if (!val) { setError("Usuário não encontrado."); setLoading(false); return; }
        const [id, u] = Object.entries(val)[0];
        if (u.password !== lp) { setError("Senha incorreta."); setLoading(false); return; }
        onSuccess({ id, username: u.username, gmail: u.gmail, role: u.role || "user", resellerKey: u.resellerKey, avatar: u.avatar || null });
      })
      .catch((err) => {
        console.error(err);
        setError("Erro ao consultar o banco. Verifique as regras do Realtime Database (projeto key-coisas).");
        setLoading(false);
      });
  };

  const doSignup = () => {
    setError("");
    if (!su.trim() || !sp || !sg.trim() || !sk.trim()) { setError("Preencha todos os campos."); return; }
    if (!authDbAvailable) { setError("Serviço de cadastro indisponível no momento."); return; }
    setLoading(true);
    resellersRef.orderByChild("resellerKey").equalTo(sk.trim().toUpperCase()).once("value")
      .then((snap) => {
        const val = snap.val();
        if (!val) { setError("Key de revenda inválida."); setLoading(false); return; }
        const [resellerId, reseller] = Object.entries(val)[0];
        if (!reseller.balance || reseller.balance <= 0) { setError("Essa key não possui créditos disponíveis."); setLoading(false); return; }
        return usersRef.orderByChild("username").equalTo(su.trim()).once("value").then((usnap) => {
          if (usnap.val()) { setError("Esse usuário já existe."); setLoading(false); return; }
          return usersRef.once("value").then((allSnap) => {
            const isFirstEver = !allSnap.val();
            const role = isFirstEver ? "dono" : "user";
            const record = { username: su.trim(), password: sp, gmail: sg.trim(), resellerKey: sk.trim().toUpperCase(), createdAt: Date.now(), role, avatar: null };
            return usersRef.push(record).then((ref) => {
              resellersRef.child(resellerId).update({ balance: reseller.balance - 1 });
              onSuccess({ ...record, id: ref.key });
            });
          });
        });
      })
      .catch((err) => {
        console.error(err);
        setError("Erro ao cadastrar. Verifique as regras do Realtime Database (projeto key-coisas).");
        setLoading(false);
      });
  };

  return (
    <div className="auth-shell">
      <div className="auth-blob auth-blob1"></div>
      <div className="auth-blob auth-blob2"></div>
      <div className="auth-blob auth-blob3"></div>
      <div className="auth-card">
        <div className="auth-hex"><Icon name="skull" size={24} style={{ color: "#fff" }} /></div>
        <div className="auth-title">PÂNICO <b>CHEATS</b></div>
        <div className="auth-sub">Acesso restrito a revendedores autorizados</div>

        <div className="auth-tabs">
          <button className={`auth-tab ${tab === "login" ? "sel" : ""}`} onClick={() => switchTab("login")}>Entrar</button>
          <button className={`auth-tab ${tab === "signup" ? "sel" : ""}`} onClick={() => switchTab("signup")}>Criar Conta</button>
        </div>

        {error && <div className="auth-error">{error}</div>}

        {tab === "login" ? (
          <>
            <div className="auth-field">
              <input placeholder="Usuário" value={lu} onChange={(e) => setLu(e.target.value)} />
              <span className="ic"><Icon name="user" size={16} /></span>
            </div>
            <div className="auth-field">
              <input type="password" placeholder="Senha" value={lp} onChange={(e) => setLp(e.target.value)} onKeyDown={(e) => e.key === "Enter" && doLogin()} />
              <span className="ic"><Icon name="lock" size={16} /></span>
            </div>
            <button className="auth-btn" onClick={doLogin} disabled={loading}>
              <Icon name="zap" size={16} /> {loading ? "Entrando..." : "Entrar"}
            </button>
          </>
        ) : (
          <>
            <div className="auth-field">
              <input placeholder="Usuário" value={su} onChange={(e) => setSu(e.target.value)} />
              <span className="ic"><Icon name="user" size={16} /></span>
            </div>
            <div className="auth-field">
              <input type="password" placeholder="Senha" value={sp} onChange={(e) => setSp(e.target.value)} />
              <span className="ic"><Icon name="lock" size={16} /></span>
            </div>
            <div className="auth-field">
              <input type="email" placeholder="Gmail" value={sg} onChange={(e) => setSg(e.target.value)} />
              <span className="ic"><Icon name="mail" size={16} /></span>
            </div>
            <div className="auth-field">
              <input placeholder="Key de revenda" value={sk} onChange={(e) => setSk(e.target.value)} />
              <span className="ic"><Icon name="key" size={16} /></span>
            </div>
            <button className="auth-btn" onClick={doSignup} disabled={loading}>
              <Icon name="zap" size={16} /> {loading ? "Criando..." : "Criar Conta"}
            </button>
          </>
        )}

        <div className="auth-note">Cada conta criada consome 1 crédito da key de revenda utilizada.</div>
      </div>
    </div>
  );
}

const SESSION_KEY = "panico_cheats_session_v1";

function loadSession() {
  try {
    const raw = localStorage.getItem(SESSION_KEY);
    if (!raw) return null;
    const data = JSON.parse(raw);
    if (!data || !data.username || !data.id) return null;
    return data;
  } catch (e) {
    return null;
  }
}

function saveSession(user) {
  try {
    if (!user) {
      localStorage.removeItem(SESSION_KEY);
      return;
    }
    // Não salva senha — só dados de sessão necessários
    const safe = {
      id: user.id,
      username: user.username,
      gmail: user.gmail || "",
      role: user.role || "user",
      resellerKey: user.resellerKey || "",
      avatar: user.avatar || null,
    };
    localStorage.setItem(SESSION_KEY, JSON.stringify(safe));
  } catch (e) {
    console.error("Não foi possível salvar a sessão:", e);
  }
}

function AuthGate() {
  const [user, setUser] = useState(() => loadSession());

  const handleLogin = (u) => {
    saveSession(u);
    setUser(u);
  };

  const handleLogout = () => {
    saveSession(null);
    setUser(null);
  };

  if (!user) return <AuthScreen onSuccess={handleLogin} />;
  return <App currentUser={user} onLogout={handleLogout} />;
}

ReactDOM.createRoot(document.getElementById("root")).render(<AuthGate />);
</script>
</body>
</html>
